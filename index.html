  <body>
    <div id="root">
      <style>
        .boot {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          background: #0a0b0f;
        }
        .boot-dot {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          border: 2px solid rgba(255, 77, 125, 0.25);
          border-top-color: #ff4d7d;
          animation: boot-spin 0.8s linear infinite;
        }
        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .boot-dot {
            animation: none;
          }
        }
      </style>
      <div class="boot"><div class="boot-dot"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
