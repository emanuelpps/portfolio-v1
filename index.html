<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Mode and language both have to be on the element before the first pixel
      is painted. React boots long after that, so a dark page would flash white
      on every cold load, and a Spanish-speaking visitor would read English for
      200ms before the page changed under them. This is the only blocking
      script on the page.

      Both follow the same rule: a stored choice wins, and with none the
      visitor's own environment decides — the OS for the mode, the browser's
      language list for the copy.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var storedTheme = localStorage.getItem("ep-theme");
          var theme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          root.dataset.theme = theme;
          root.style.backgroundColor =
            theme === "light" ? "#ECEEF1" : "#0F1621";
        } catch (e) {
          root.dataset.theme = "dark";
        }
        try {
          var storedLang = localStorage.getItem("ep-lang");
          if (storedLang === "en" || storedLang === "es") {
            root.lang = storedLang;
          } else {
            var tags = navigator.languages || [navigator.language || "en"];
            root.lang = Array.prototype.some.call(tags, function (tag) {
              return tag && tag.toLowerCase().indexOf("es") === 0;
            })
              ? "es"
              : "en";
          }
        } catch (e) {
          root.lang = "en";
        }
      })();
    </script>

    <!--
      Archivo carries the reading text and Archivo Black every display line,
      both self-hosted so the headline face is not a third-party connection on
      the critical path. Only the latin cuts are preloaded — they are the ones
      that always render; latin-ext is declared in CSS behind a unicode-range,
      so the browser fetches it only if a glyph actually needs it.
    -->
    <link
      rel="preload"
      href="/fonts/ArchivoBlack-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Archivo-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/svg+xml" href="/ep-log.ico" />
    <meta name="theme-color" content="#0F1621" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link href="/src/index.css" rel="stylesheet" />

    <title>Emanuel Pagés | Frontend Developer</title>

    <!-- Meta description -->
    <meta
      name="description"
      content="Frontend developer who thinks like a marketer: a decade of growth and SEO before React, now building fast, responsive React and TypeScript interfaces."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Emanuel Pagés | Frontend Developer" />
    <meta
      property="og:description"
      content="Frontend developer who thinks like a marketer: a decade of growth and SEO before React, now building fast, responsive React and TypeScript interfaces."
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dkgoszhfr/image/upload/v1753999829/302shots_so_ltvevc.png"
    />
    <meta property="og:url" content="https://emanuelp-portfolio.vercel.app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emanuel Pagés | Frontend Developer" />
    <meta
      name="twitter:description"
      content="Frontend developer who thinks like a marketer: a decade of growth and SEO before React, now building fast, responsive React and TypeScript interfaces."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/dkgoszhfr/image/upload/v1753999829/302shots_so_ltvevc.png"
    />
  </head>
  <body>
    <div id="root">
      <style>
        /* The first thing on screen is the mark drawing itself — the same three
           strokes, in the same order, as the signature at the foot of the page.
           No spinner: a rotating circle would be the one curve on this site
           that isn't the P's bowl.

           It reads the mode off the element the inline script above already
           set, so the boot screen is never the wrong colour. */
        .boot {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          background: #0f1621;
          color: #f2f3f5;
        }
        :root[data-theme="light"] .boot {
          background: #eceef1;
          color: #0f1621;
        }
        .boot svg {
          width: 56px;
          height: 56px;
          stroke: currentColor;
          animation: boot-breathe 2.4s ease-in-out 1.3s infinite;
        }
        /* pathLength="1" normalises every stroke to a length of 1, so three
           paths of very different real lengths can share one keyframe. */
        .boot path {
          stroke-dasharray: 1;
          stroke-dashoffset: 1;
          animation: boot-draw 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .boot path:nth-child(2) {
          animation-delay: 0.18s;
        }
        .boot path:nth-child(3) {
          animation-delay: 0.36s;
        }
        @keyframes boot-draw {
          to {
            stroke-dashoffset: 0;
          }
        }
        @keyframes boot-breathe {
          0%,
          100% {
            opacity: 1;
          }
          50% {
            opacity: 0.45;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .boot svg {
            animation: none;
          }
          .boot path {
            animation: none;
            stroke-dashoffset: 0;
          }
        }
      </style>
      <div class="boot">
        <svg
          viewBox="0 0 160 160"
          fill="none"
          stroke-width="9"
          stroke-linecap="square"
          role="img"
          aria-label="Loading"
        >
          <path pathLength="1" d="M10 150 V10 H108 A35 35 0 0 1 108 80 H10" />
          <path pathLength="1" d="M72 10 V150" />
          <path pathLength="1" d="M10 150 H72" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
